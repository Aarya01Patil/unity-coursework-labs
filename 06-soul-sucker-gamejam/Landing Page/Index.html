<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasite Player | The Void</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;600&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            animation: fadeIn 3s ease-out forwards;
            opacity: 0;
        }

        .subtitle {
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 4rem;
            animation: fadeIn 3s ease-out 1s forwards;
            opacity: 0;
        }

        .highlight {
            color: #ff2a75;
            font-style: italic;
        }

        .play-link {
            font-size: 0.8rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            padding: 1.2rem 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.5s ease;
            text-decoration: none;
            color: #fff;
            position: relative;
            overflow: hidden;
            animation: fadeIn 3s ease-out 2s forwards;
            opacity: 0;
        }

        .play-link::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: #ff2a75;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            transition: width 0.5s ease, height 0.5s ease;
            z-index: -1;
        }

        .play-link:hover::before {
            width: 300px;
            height: 300px;
        }

        .play-link:hover {
            border-color: #ff2a75;
            box-shadow: 0 0 30px rgba(255, 42, 117, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="content">
        <div class="subtitle">Without a host, you are nothing.</div>
        <h1>SOUL <span class="highlight">SUCKER</span></h1>
        <a href="index.html" class="play-link">Enter the Game</a>
    </div>

    <script>
        // Cinematic Mouse-follower Canvas Effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let parasite = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let trail = [];
        let spores = [];

        function initSpores() {
            spores = [];
            // Calculate number of background spores based on screen size
            let count = Math.floor((width * height) / 9000);
            for(let i = 0; i < count; i++) {
                spores.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    size: Math.random() * 1.5 + 0.5,
                    offset: Math.random() * Math.PI * 2
                });
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initSpores();
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        });

        resize();

        function animate() {
            // Replaced plain black with a deep, bruised organic crimson-black void
            ctx.fillStyle = 'rgba(8, 2, 4, 0.15)'; 
            ctx.fillRect(0, 0, width, height);

            // --- Draw Background Spore Network ---
            ctx.fillStyle = 'rgba(255, 42, 117, 0.2)';
            ctx.strokeStyle = 'rgba(255, 42, 117, 0.05)';
            ctx.lineWidth = 0.5;

            for(let i = 0; i < spores.length; i++) {
                let s = spores[i];
                
                // Organic wiggle movement
                s.x += s.vx + Math.sin(Date.now() * 0.001 + s.offset) * 0.3;
                s.y += s.vy + Math.cos(Date.now() * 0.001 + s.offset) * 0.3;
                
                // Spores get pulled towards the main parasite
                let dxSpore = parasite.x - s.x;
                let dySpore = parasite.y - s.y;
                let distSq = dxSpore * dxSpore + dySpore * dySpore;
                if (distSq < 40000) { // Reaction radius
                    let dist = Math.sqrt(distSq);
                    s.x += (dxSpore / dist) * 0.8;
                    s.y += (dySpore / dist) * 0.8;
                }

                // Wrap around edges
                if(s.x < 0) s.x = width; if(s.x > width) s.x = 0;
                if(s.y < 0) s.y = height; if(s.y > height) s.y = 0;

                // Draw spore
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();

                // Connect nearby spores (creates the faint vein/web effect)
                for(let j = i + 1; j < spores.length; j++) {
                    let s2 = spores[j];
                    let dx2 = s.x - s2.x;
                    let dy2 = s.y - s2.y;
                    if(dx2 * dx2 + dy2 * dy2 < 5000) {
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(s2.x, s2.y);
                        ctx.stroke();
                    }
                }
            }
            // --- End Spores ---

            // Smooth interpolation towards mouse
            parasite.x += (mouse.x - parasite.x) * 0.05;
            parasite.y += (mouse.y - parasite.y) * 0.05;

            // Store trail positions
            trail.push({ x: parasite.x, y: parasite.y });
            if (trail.length > 40) trail.shift();

            // Draw trail
            ctx.beginPath();
            if(trail.length > 0) {
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < trail.length; i++) {
                    // Wiggle effect for the trail
                    let wiggleX = Math.sin(Date.now() * 0.01 + i) * (i/4);
                    let wiggleY = Math.cos(Date.now() * 0.01 + i) * (i/4);
                    ctx.lineTo(trail[i].x + wiggleX, trail[i].y + wiggleY);
                }
            }
            
            // Gradient trail stroke
            let gradient = ctx.createLinearGradient(
                trail.length > 0 ? trail[0].x : parasite.x, 
                trail.length > 0 ? trail[0].y : parasite.y, 
                parasite.x, parasite.y
            );
            gradient.addColorStop(0, 'rgba(255, 42, 117, 0)');
            gradient.addColorStop(1, 'rgba(255, 42, 117, 0.8)');
            
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ff2a75';
            ctx.stroke();

            // Draw core
            ctx.beginPath();
            ctx.arc(parasite.x, parasite.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            
            // Draw pulsing outer core
            let pulse = Math.abs(Math.sin(Date.now() * 0.005)) * 10;
            ctx.beginPath();
            ctx.arc(parasite.x, parasite.y, 10 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 42, 117, 0.3)';
            ctx.fill();

            // Reset shadow
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
